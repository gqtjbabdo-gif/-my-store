<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Abdo Store</title>
</head>
<body>
    <h1>أهلاً بك في متجر عبدو</h1>
    <div id="root">جاري تحميل النتائج...</div>
    <script>
        // محاكاة بسيطة لعرض البيانات
        fetch('matches.json')
            .then(response => response.json())
            .then(data => {
                const root = document.getElementById('root');
                root.innerHTML = '<ul>' + data.map(m => `<li>${m.home} vs ${m.away}: ${m.score}</li>`).join('') + '</ul>';
            });
    </script>
</body>
</html>
