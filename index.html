    <style>

        .date-header { background: #2f3542; padding: 10px; border-radius: 8px; margin: 15px 0; text-align: center; font-weight: bold; color: #7ed6df; }

        .team:nth-child(3) { justify-content: flex-end; }
        .flag { width: 25px; border-radius: 3px; }
        .time { font-weight: bold; color: #fff; background: #1a1c23; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; }
    </style>
</head>
