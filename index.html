<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 FIFA World Cup Schedule</title>
    <style>
        :root {
            --bg-dark: #1a1c23;
            --card-bg: #2f3542;
            --accent-orange: #ffa502;
            --accent-blue: #7ed6df;
            --btn-red: #ff0000;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            padding: 20px; 
            margin: 0; 
        }

        h2 { text-align: center; color: var(--accent-orange); margin-bottom: 30px; }

        .date-header { 
            background: var(--card-bg); 
            padding: 10px; 
            border-radius: 8px; 
            margin: 20px 0 10px 0; 
            text-align: center; 
            font-weight: bold; 
            color: var(--accent-blue); 
        }

        .match-card { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--card-bg); 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border-left: 4px solid var(--accent-orange); 
        }

        .team { display: flex; align-items: center; gap: 10px; width: 35%; font-size: 0.95em; }
        .team.away { justify-content: flex-end; }

        .flag { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; }

        .middle-section { display: flex; flex-direction: column; align-items: center; width: 30%; gap: 8px; }

        .time { 
            font-weight: bold; 
            color: #fff; 
            background: var(--bg-dark); 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-size: 0.8em; 
        }

        .watch-btn { 
            background-color: var(--btn-red); 
            color: white; 
            padding: 6px 16px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-size: 0.8em; 
            font-weight: bold; 
            transition: background 0.3s ease; 
        }

        .watch-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <h2>2026 World Cup Match Center</h2>
    <div id="container">Loading match schedule...</div>

    <script>
        async function fetchMatches() {
            try {
                const response = await fetch('matches.json');
                if (!response.ok) throw new Error('Failed to load JSON');
                
                const data = await response.json();
                renderMatches(data);
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('container').innerHTML = "<p style='text-align:center;'>Unable to load match schedule at this time.</p>";
            }
        }

        function renderMatches(data) {
            const container = document.getElementById('container');
            container.innerHTML = data.map(day => `
                <div class="date-header">${day.date}</div>
                ${day.matches.map(m => `
                    <div class="match-card">
                        <div class="team">
                            ${m.home} 
                            <img class="flag" src="https://flagsapi.com/${m.homeCode}/flat/64.png" alt="${m.home}">
                        </div>
                        <div class="middle-section">
                            <div class="time">${m.time}</div>
                            <a href="${m.link}" target="_blank" class="watch-btn">Watch Match</a>
                        </div>
                        <div class="team away">
                            <img class="flag" src="https://flagsapi.com/${m.awayCode}/flat/64.png" alt="${m.away}"> 
                            ${m.away}
                        </div>
                    </div>
                `).join('')}
            `).join('');
        }

        // Initialize
        fetchMatches();
    </script>
</body>
</html>
