<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتائج المباريات</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .match-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>جدول المباريات</h1>
    <div id="container">جاري التحميل...</div>
    <script>
        fetch('matches.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('container');
                container.innerHTML = data.map(m => `
                    <div class="match-card">
                        ${m.homeTeam.name} vs ${m.awayTeam.name}
                        <br> النتيجة: ${m.score.fullTime.home ?? '-'} - ${m.score.fullTime.away ?? '-'}
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('container').innerText = 'خطأ في تحميل البيانات.';
            });
    </script>
</body>
</html>
