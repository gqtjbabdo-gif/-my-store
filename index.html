<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Abdo Store</h1>
    <div id="container">Loading...</div>

    <script>
      fetch('https://gqtjbabdo-gif.github.io/-my-store/matches.json')              .then(res => res.json())
            .then(data => {
                const container = document.getElementById('container');
                container.innerHTML = '';
                data.forEach(m => {
                    container.innerHTML += `<p>${m.teams} - ${m.score}</p>`;
                });
            })
            .catch(() => {
                document.getElementById('container').innerText = "Error loading file";
            });
    </script>
</body>
</html>
