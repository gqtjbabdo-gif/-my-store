name: Auto Update Matches

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch:      # Allows manual trigger via the GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential to allow the bot to commit changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python update_matches.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: matches.json" && git push)
